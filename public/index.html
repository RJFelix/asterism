<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asterism — Spatial Canvas &amp; Innovation Train</title>
  <style>
    :root {
      --bg-deep: #070a12;
      --bg-panel: rgba(15, 23, 42, 0.85);
      --border-subtle: rgba(148, 163, 184, 0.18);
      --accent-cyan: #38bdf8;
      --accent-purple: #a855f7;
      --accent-pink: #f472b6;
      --accent-emerald: #10b981;
      --accent-amber: #fbbf24;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: var(--bg-deep);
      color: var(--text-main);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      user-select: none;
    }

    /* Infinite Canvas Backdrop */
    #canvas-viewport {
      position: absolute; inset: 0; overflow: hidden; cursor: grab;
      background-color: var(--bg-deep);
      background-image:
        radial-gradient(rgba(148, 163, 184, 0.16) 1px, transparent 1px),
        radial-gradient(rgba(56, 189, 248, 0.05) 1px, transparent 1px);
      background-size: 28px 28px, 140px 140px;
    }
    #canvas-viewport.panning { cursor: grabbing; }
    #canvas-viewport.mode-draw { cursor: crosshair; }
    #canvas-viewport.mode-connect { cursor: alias; }

    #canvas-world {
      position: absolute; top: 0; left: 0;
      width: 6000px; height: 4000px;
      transform-origin: 0 0;
    }

    #svg-layer {
      position: absolute; top: 0; left: 0;
      width: 6000px; height: 4000px;
      pointer-events: none; overflow: visible;
    }

    /* Top Floating HUD Toolbar */
    .hud-topbar {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
      z-index: 100; display: flex; align-items: center; gap: 7px;
      padding: 7px 12px; border-radius: 12px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(148, 163, 184, 0.22);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.55);
      max-width: 96vw;
      flex-wrap: wrap;
    }
    .brand {
      display: flex; align-items: center; gap: 7px;
      font-weight: 700; font-size: 13px; letter-spacing: 0.03em;
      padding-right: 10px; border-right: 1px solid var(--border-subtle);
      color: #f8fafc;
    }
    .brand-star {
      color: var(--accent-cyan); font-size: 16px;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
    }
    .tool-btn {
      background: rgba(30, 41, 59, 0.75);
      color: var(--text-muted);
      border: 1px solid rgba(148, 163, 184, 0.16);
      padding: 6px 10px; border-radius: 8px;
      font-size: 11.5px; font-weight: 500; cursor: pointer;
      display: flex; align-items: center; gap: 5px;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .tool-btn:hover { color: var(--text-main); border-color: rgba(148, 163, 184, 0.38); }
    .tool-btn.active {
      background: rgba(56, 189, 248, 0.18);
      color: var(--accent-cyan);
      border-color: rgba(56, 189, 248, 0.5);
    }
    .tool-btn.synth-btn {
      background: rgba(251, 191, 36, 0.15);
      color: #fcd34d;
      border-color: rgba(251, 191, 36, 0.42);
      font-weight: 600;
    }
    .tool-btn.synth-btn:hover {
      background: rgba(251, 191, 36, 0.28);
      border-color: #fbbf24;
    }
    .zoom-readout {
      font-family: ui-monospace, monospace; font-size: 11px;
      color: var(--text-muted); min-width: 44px; text-align: center;
    }

    /* Spatial Node Cards */
    .canvas-node {
      position: absolute;
      display: flex; flex-direction: column;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid rgba(148, 163, 184, 0.24);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.52);
      backdrop-filter: blur(10px);
      overflow: hidden;
      transition: box-shadow 0.2s, border-color 0.2s;
    }
    .canvas-node.role-dialogue {
      border-top: 2px solid rgba(56, 189, 248, 0.65);
    }
    .canvas-node.role-spec-diagram {
      border-top: 2px solid rgba(192, 132, 252, 0.65);
    }
    .canvas-node.role-ui-prototype {
      border-top: 2px solid rgba(244, 114, 182, 0.72);
    }
    .canvas-node.role-artifact-harness {
      border-top: 2px solid rgba(52, 211, 153, 0.72);
    }
    .canvas-node.kind-speculative {
      border-color: rgba(168, 85, 247, 0.48);
      box-shadow: 0 16px 38px rgba(88, 28, 135, 0.25);
    }
    .canvas-node.status-committed {
      border-color: rgba(16, 185, 129, 0.55);
      box-shadow: 0 16px 38px rgba(16, 185, 129, 0.16);
    }
    .canvas-node.selected-for-synth {
      border-color: #fbbf24 !important;
      box-shadow: 0 0 0 2px rgba(251, 191, 36, 0.45), 0 18px 40px rgba(0, 0, 0, 0.6) !important;
    }
    .canvas-node.status-mutating, .canvas-node.status-speculating {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.35);
    }
    .node-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 8px;
      background: rgba(30, 41, 59, 0.9);
      border-bottom: 1px solid rgba(148, 163, 184, 0.16);
      cursor: grab;
      gap: 4px;
    }
    .node-header:active { cursor: grabbing; }
    .node-title-wrap {
      display: flex; align-items: center; gap: 4px; overflow: hidden; flex: 1;
    }
    .synth-check-btn {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.3);
      color: #94a3b8;
      border-radius: 4px;
      width: 17px; height: 17px;
      font-size: 10px; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0; padding: 0;
    }
    .synth-check-btn.checked {
      background: rgba(251, 191, 36, 0.25);
      border-color: #fbbf24;
      color: #fde68a;
    }
    .role-select {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #38bdf8;
      border-radius: 5px;
      font-size: 9px;
      font-family: ui-monospace, monospace;
      font-weight: 700;
      padding: 2px 4px;
      cursor: pointer;
      outline: none;
      flex-shrink: 0;
    }
    .canvas-node.role-spec-diagram .role-select {
      border-color: rgba(192, 132, 252, 0.45);
      color: #d8b4fe;
    }
    .canvas-node.role-ui-prototype .role-select {
      border-color: rgba(244, 114, 182, 0.45);
      color: #f9a8d4;
    }
    .canvas-node.role-artifact-harness .role-select {
      border-color: rgba(52, 211, 153, 0.45);
      color: #6ee7b7;
    }
    .node-stage-pill {
      font-family: ui-monospace, monospace; font-size: 8.5px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.04em;
      padding: 2px 5px; border-radius: 5px;
      background: rgba(148, 163, 184, 0.14); color: #cbd5e1;
      border: 1px solid rgba(148, 163, 184, 0.25);
      white-space: nowrap; flex-shrink: 0;
    }
    .node-title {
      font-size: 11px; font-weight: 600; color: #f8fafc;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .node-actions {
      display: flex; align-items: center; gap: 3px; flex-shrink: 0;
    }
    .model-select, .spawn-rel-select {
      background: rgba(15, 23, 42, 0.85);
      color: #cbd5e1;
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 5px;
      font-size: 9px;
      font-family: ui-monospace, monospace;
      padding: 2px 4px;
      cursor: pointer;
      outline: none;
      max-width: 86px;
    }
    .spawn-rel-select {
      color: #f9a8d4;
      border-color: rgba(244, 114, 182, 0.4);
      background: rgba(244, 114, 182, 0.12);
      font-weight: 600;
      max-width: 78px;
    }
    .model-select:hover, .spawn-rel-select:hover { border-color: var(--accent-cyan); color: #f8fafc; }
    .mini-btn {
      background: rgba(15, 23, 42, 0.7);
      color: var(--text-muted);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 6px; padding: 3px 5px;
      font-size: 9.5px; cursor: pointer;
      white-space: nowrap;
    }
    .mini-btn:hover { color: #f8fafc; border-color: var(--accent-cyan); }
    .mini-btn.keep-btn {
      display: none;
      color: #fde68a; border-color: rgba(251, 191, 36, 0.5);
      background: rgba(251, 191, 36, 0.16);
      font-weight: 600;
    }
    .canvas-node.kind-speculative .mini-btn.keep-btn {
      display: inline-block;
    }
    .mini-btn.spec-btn {
      color: #e9d5ff; border-color: rgba(168, 85, 247, 0.45);
      background: rgba(168, 85, 247, 0.16);
      font-weight: 600;
    }
    .mini-btn.spec-btn:hover { background: rgba(168, 85, 247, 0.32); }
    .mini-btn.advance-btn {
      color: #6ee7b7; border-color: rgba(16, 185, 129, 0.45);
      background: rgba(16, 185, 129, 0.16);
      font-weight: 600;
    }
    .mini-btn.advance-btn:hover { background: rgba(16, 185, 129, 0.32); }

    /* Feature 1: Worktree & Diff Inspector Sub-Bar for IMPLEMENT nodes */
    .worktree-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 4px 8px;
      background: rgba(6, 78, 59, 0.35);
      border-bottom: 1px solid rgba(16, 185, 129, 0.3);
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 10px;
      color: #6ee7b7;
    }
    .canvas-node.stage-implement .worktree-bar,
    .canvas-node.role-artifact-harness .worktree-bar {
      display: flex;
    }
    /* Crystallization Facet Tab Bar (`[💬 Steer | 📐 Spec | 🎨 UI | ⚙ Code]`) */
    .facet-tab-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 3px 8px;
      background: rgba(15, 23, 42, 0.88);
      border-bottom: 1px solid rgba(148, 163, 184, 0.14);
      gap: 4px;
    }
    .facet-tabs {
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .facet-tab {
      background: rgba(30, 41, 59, 0.65);
      color: #94a3b8;
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 5px;
      padding: 2px 6px;
      font-size: 9.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .facet-tab:hover { color: #f8fafc; border-color: rgba(56, 189, 248, 0.4); }
    .facet-tab.active {
      background: rgba(56, 189, 248, 0.18);
      color: #38bdf8;
      border-color: rgba(56, 189, 248, 0.5);
    }
    .facet-tab.cached::after {
      content: "•";
      color: #34d399;
      margin-left: 2px;
    }
    .facet-meta-right {
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: ui-monospace, monospace;
      font-size: 9px;
      color: #94a3b8;
    }
    .energy-pill {
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
      cursor: pointer;
    }
    .tearoff-btn {
      background: rgba(30, 41, 59, 0.8);
      color: #cbd5e1;
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 9px;
      cursor: pointer;
    }
    .tearoff-btn:hover {
      border-color: var(--accent-cyan);
      color: #38bdf8;
    }
    /* Comparison Matrix Modal */
    #compare-modal {
      display: none;
      position: fixed;
      inset: 58px 24px 24px 24px;
      z-index: 250;
      background: rgba(9, 13, 24, 0.96);
      border: 1px solid rgba(56, 189, 248, 0.45);
      border-radius: 14px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(16px);
      flex-direction: column;
      overflow: hidden;
    }
    #compare-modal.open { display: flex; }
    .compare-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 12px;
      padding: 12px;
      overflow: auto;
    }
    .compare-col {
      display: flex;
      flex-direction: column;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 10px;
      overflow: hidden;
    }
    .wt-meta {
      display: flex; align-items: center; gap: 6px; overflow: hidden; white-space: nowrap;
    }
    .wt-diff-stat {
      padding: 1px 5px; border-radius: 4px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.2);
      font-size: 9.5px;
    }
    .wt-diff-stat .ins { color: #34d399; }
    .wt-diff-stat .del { color: #f87171; }
    .wt-actions {
      display: flex; align-items: center; gap: 4px; flex-shrink: 0;
    }
    .wt-btn {
      background: rgba(15, 23, 42, 0.8);
      color: #a7f3d0;
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 9.5px;
      font-family: ui-monospace, monospace;
      cursor: pointer;
    }
    .wt-btn:hover { background: rgba(16, 185, 129, 0.25); color: #ffffff; }

    .node-body {
      flex: 1; position: relative; overflow: auto;
      background: rgba(9, 13, 24, 0.7);
      user-select: text;
    }
    .node-iframe {
      width: 100%; height: 100%; border: none; display: block;
      background: transparent;
    }
    .node-code-editor {
      display: none; width: 100%; height: 100%;
      background: #050811; color: #38bdf8;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 11.5px; padding: 10px; border: none; outline: none;
      resize: none;
    }
    .node-diff-inspector {
      display: none; width: 100%; height: 100%;
      background: #060913; color: #e2e8f0;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 11px; padding: 10px; overflow: auto;
    }
    .canvas-node.editing-html .node-iframe { display: none; }
    .canvas-node.editing-html .node-code-editor { display: block; }
    .canvas-node.viewing-diff .node-iframe { display: none; }
    .canvas-node.viewing-diff .node-diff-inspector { display: block; }

    /* Prompt / Co-Design Footer inside each Node */
    .node-footer {
      display: flex; align-items: center; gap: 5px;
      padding: 6px 8px;
      background: rgba(15, 23, 42, 0.95);
      border-top: 1px solid rgba(148, 163, 184, 0.15);
    }
    .state-pill {
      font-family: ui-monospace, monospace;
      font-size: 9.5px;
      padding: 2px 5px;
      border-radius: 4px;
      background: rgba(56, 189, 248, 0.12);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.25);
      white-space: nowrap;
      cursor: help;
    }
    .node-prompt-input {
      flex: 1; background: rgba(30, 41, 59, 0.75);
      border: 1px solid rgba(148, 163, 184, 0.22);
      color: #f8fafc; border-radius: 6px;
      padding: 5px 8px; font-size: 11px; outline: none;
    }
    .node-prompt-input:focus { border-color: var(--accent-cyan); }
    .node-send-btn {
      background: #0284c7; color: white; border: none;
      border-radius: 6px; padding: 5px 9px;
      font-size: 11px; font-weight: 600; cursor: pointer;
    }
    .node-send-btn:hover { background: #0369a1; }

    /* Resize Handle */
    .resize-handle {
      position: absolute; right: 0; bottom: 0;
      width: 14px; height: 14px; cursor: nwse-resize;
      background: linear-gradient(135deg, transparent 50%, rgba(148, 163, 184, 0.4) 50%);
    }

    /* Status Toast */
    #status-toast {
      position: fixed; bottom: 16px; left: 16px; z-index: 100;
      padding: 8px 14px; border-radius: 9px;
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid rgba(56, 189, 248, 0.35);
      font-size: 12px; color: #bae6fd;
      display: none;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>
  <div class="hud-topbar">
    <div class="brand">
      <span class="brand-star">✦</span>
      <span>ASTERISM</span>
    </div>
    <button class="tool-btn active" id="mode-select" onclick="setMode('select')">↖ Pan / Interact</button>
    <button class="tool-btn" id="mode-draw" onclick="setMode('draw')">✎ Sketch</button>
    <button class="tool-btn" id="mode-connect" onclick="setMode('connect')">⤳ Wire Panels</button>
    <button class="tool-btn" onclick="createNewSurface()">＋ New Proposal</button>
    <button class="tool-btn synth-btn" id="btn-synthesize" onclick="synthesizeSelectedOrKept()" title="Select 2+ panels (even a Spec + a UI Prototype!) to converge them into a unified hybrid surface">⊕ Synthesize Panels</button>
    <button class="tool-btn" onclick="openComparisonMatrix()" title="Project 2+ selected or speculative sibling forks into a single side-by-side Comparison Matrix Lens">⊞ Compare Matrix Lens</button>
    <button class="tool-btn" onclick="pulseBasalFreeEnergy()" title="Allocate excess 'effective free' Basal Metabolic Energy to exhausted or high-EVOI frontier directions">🔋 Basal Energy Pulse</button>
    <button class="tool-btn" onclick="pruneUnkeptForks()" title="Remove only speculative branches you haven't marked Keep">✂ Prune Unkept</button>
    <button class="tool-btn" onclick="clearSketches()">⌫ Clear Ink</button>
    <button class="tool-btn" onclick="resetCanvas()">↺ Reset</button>
    <span class="zoom-readout" id="zoom-label">84%</span>
  </div>

  <div id="compare-modal">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:rgba(15,23,42,0.95);border-bottom:1px solid rgba(148,163,184,0.2);">
      <div>
        <strong style="color:#38bdf8;font-size:13px;">⊞ Crystallization Lens: Multi-Fork Comparison Matrix</strong>
        <span id="compare-subtitle" style="color:#94a3b8;font-size:11.5px;margin-left:10px;">Side-by-side projection over sibling Speculative Thoughts</span>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="tool-btn synth-btn" onclick="synthesizeFromComparisonMatrix()">⊕ Synthesize Compared Forks</button>
        <button class="tool-btn" onclick="closeComparisonMatrix()">✕ Close Matrix</button>
      </div>
    </div>
    <div class="compare-grid" id="compare-grid"></div>
  </div>

  <div id="canvas-viewport">
    <div id="canvas-world">
      <svg id="svg-layer">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 8 5 L 0 9 z" fill="rgba(56, 189, 248, 0.65)" />
          </marker>
          <marker id="arrow-synth" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 8 5 L 0 9 z" fill="rgba(251, 191, 36, 0.85)" />
          </marker>
          <marker id="arrow-ui" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 8 5 L 0 9 z" fill="rgba(244, 114, 182, 0.85)" />
          </marker>
          <marker id="arrow-spec" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 8 5 L 0 9 z" fill="rgba(192, 132, 252, 0.85)" />
          </marker>
          <marker id="arrow-impl" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 8 5 L 0 9 z" fill="rgba(52, 211, 153, 0.85)" />
          </marker>
        </defs>
        <g id="edges-group"></g>
        <g id="strokes-group"></g>
      </svg>
      <div id="nodes-layer"></div>
    </div>
  </div>

  <div id="status-toast"></div>

  <script>
    const AVAILABLE_MODELS = [
      { id: 'openai/gpt-6-luna', label: 'gpt-6-luna' },
      { id: 'openai/gpt-6.1-terra', label: 'gpt-6.1-terra' },
      { id: 'openai/gpt-6.1-sol', label: 'gpt-6.1-sol' },
      { id: 'openai/gpt-6-astra', label: 'gpt-6-astra' },
      { id: 'openai/gpt-5.3-codex', label: 'gpt-5.3-codex' },
    ];

    const AVAILABLE_ROLES = [
      { id: 'dialogue', label: '💬 Dialogue' },
      { id: 'spec-diagram', label: '📐 Spec' },
      { id: 'ui-prototype', label: '🎨 UI Sample' },
      { id: 'artifact-harness', label: '⚙ Artifact' },
    ];

    let state = {
      viewport: { x: 65, y: 55, scale: 0.84 },
      nodes: [],
      edges: [],
      strokes: []
    };

    let mode = 'select';
    let isPanning = false;
    let panStart = { x: 0, y: 0 };
    let activeStroke = null;
    let connectSourceId = null;
    const selectedForSynth = new Set();

    const viewportEl = document.getElementById('canvas-viewport');
    const worldEl = document.getElementById('canvas-world');
    const nodesLayer = document.getElementById('nodes-layer');
    const edgesGroup = document.getElementById('edges-group');
    const strokesGroup = document.getElementById('strokes-group');
    const zoomLabel = document.getElementById('zoom-label');
    const toastEl = document.getElementById('status-toast');
    const synthBtnEl = document.getElementById('btn-synthesize');

    function showToast(msg, ms = 3800) {
      toastEl.textContent = msg;
      toastEl.style.display = 'block';
      clearTimeout(toastEl._timer);
      if (ms > 0) {
        toastEl._timer = setTimeout(() => { toastEl.style.display = 'none'; }, ms);
      }
    }

    function defaultRoleForStage(stage) {
      if (stage === 'refine') return 'spec-diagram';
      if (stage === 'design') return 'ui-prototype';
      if (stage === 'implement') return 'artifact-harness';
      return 'dialogue';
    }

    function updateSynthButtonLabel() {
      const count = selectedForSynth.size;
      if (count >= 2) {
        synthBtnEl.textContent = `⊕ Synthesize Selected (${count})`;
      } else {
        synthBtnEl.textContent = '⊕ Synthesize Panels';
      }
    }

    function toggleNodeSynthSelection(nodeId) {
      if (selectedForSynth.has(nodeId)) {
        selectedForSynth.delete(nodeId);
      } else {
        selectedForSynth.add(nodeId);
      }
      updateSynthButtonLabel();
      renderNodes();
    }

    function setMode(nextMode) {
      mode = nextMode;

      document.querySelectorAll('.hud-topbar .tool-btn').forEach(b => b.classList.remove('active'));

    function applyTransform() {
      const { x, y, scale } = state.viewport;
      worldEl.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
      zoomLabel.textContent = `${Math.round(scale * 100)}%`;
    }

    function screenToWorld(clientX, clientY) {
      const { x, y, scale } = state.viewport;
      return {
        x: (clientX - x) / scale,
        y: (clientY - y) / scale
      };
    }

    function edgeStyleFor(edge, toNode) {
      const rel = edge.relation || edge.kind || 'advances';
      if (rel === 'synthesizes' || rel === 'synthesis') {
        return { stroke: 'rgba(251, 191, 36, 0.85)', marker: 'url(#arrow-synth)', textFill: '#fde68a', dash: '' };
      }
      if (rel === 'visualizes-ui') {
        return { stroke: 'rgba(244, 114, 182, 0.82)', marker: 'url(#arrow-ui)', textFill: '#f9a8d4', dash: '' };
      }
      if (rel === 'specifies') {
        return { stroke: 'rgba(192, 132, 252, 0.82)', marker: 'url(#arrow-spec)', textFill: '#d8b4fe', dash: '' };
      }
      if (rel === 'implements') {
        return { stroke: 'rgba(52, 211, 153, 0.85)', marker: 'url(#arrow-impl)', textFill: '#6ee7b7', dash: '' };
      }
      if (rel === 'forks' || (toNode && toNode.kind === 'speculative' && toNode.status !== 'committed')) {
        return { stroke: 'rgba(168, 85, 247, 0.6)', marker: 'url(#arrow-spec)', textFill: '#c084fc', dash: '6 4' };
      }
      return { stroke: 'rgba(56, 189, 248, 0.65)', marker: 'url(#arrow)', textFill: '#94a3b8', dash: '' };
    }

    function renderEdges() {
      edgesGroup.innerHTML = '';
      for (const edge of state.edges) {
        const from = state.nodes.find(n => n.id === edge.from);
        const to = state.nodes.find(n => n.id === edge.to);
        if (!from || !to) continue;

        const x1 = from.x + from.width;
        const y1 = from.y + from.height / 2;
        const x2 = to.x;
        const y2 = to.y + to.height / 2;
        const dx = Math.max(60, Math.abs(x2 - x1) * 0.45);

        const style = edgeStyleFor(edge, to);
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', style.stroke);
        path.setAttribute('stroke-width', '2.4');
        path.setAttribute('stroke-dasharray', style.dash);
        path.setAttribute('marker-end', style.marker);
        edgesGroup.appendChild(path);

        if (edge.label) {
          const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          text.setAttribute('x', String((x1 + x2) / 2));
          text.setAttribute('y', String((y1 + y2) / 2 - 7));
          text.setAttribute('text-anchor', 'middle');
          text.setAttribute('fill', style.textFill);
          text.setAttribute('font-size', '10.5');
          text.setAttribute('font-family', 'ui-monospace, monospace');
          text.textContent = edge.label;
          edgesGroup.appendChild(text);
        }
      }
    }

    function renderStrokes() {
      strokesGroup.innerHTML = '';
      for (const stroke of state.strokes) {
        if (!stroke.points || stroke.points.length < 2) continue;
        const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
        poly.setAttribute('points', stroke.points.map(p => `${p.x},${p.y}`).join(' '));
        poly.setAttribute('fill', 'none');
        poly.setAttribute('stroke', stroke.color || '#38bdf8');
        poly.setAttribute('stroke-width', '3');
        poly.setAttribute('stroke-linecap', 'round');
        poly.setAttribute('stroke-linejoin', 'round');
        strokesGroup.appendChild(poly);
      }
    }

    /**
     * Feature 3 + Multi-Panel Tools: Injects the bidirectional `window.asterism` SDK into every surface iframe!
     */
    function buildSrcDoc(node) {
      const initialStateJson = JSON.stringify(node.state || {}).replace(/</g, '\\u003c');
      const nodeIdJson = JSON.stringify(node.id);
      const stageJson = JSON.stringify(node.stage || 'note');
      const roleJson = JSON.stringify(node.surfaceRole || defaultRoleForStage(node.stage));
      const modelJson = JSON.stringify(node.model || 'openai/gpt-6-luna');

      return `<!DOCTYPE html><html><head><meta charset="utf-8"><style>
        html, body { margin: 0; padding: 0; background: transparent; color: #e2e8f0; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.3); border-radius: 4px; }
      </style>
      <script>
        (function() {
          const _state = ${initialStateJson};
          window.asterism = {
            nodeId: ${nodeIdJson},
            stage: ${stageJson},
            surfaceRole: ${roleJson},
            model: ${modelJson},
            state: _state,
            getState() {
              return Object.assign({}, _state);
            },
            setState(patch) {
              if (!patch || typeof patch !== 'object') return _state;
              Object.assign(_state, patch);
              window.parent.postMessage({
                type: 'asterism:set-state',
                nodeId: this.nodeId,
                patch: patch
              }, '*');
              window.dispatchEvent(new CustomEvent('asterism:statechange', { detail: this.getState() }));
              return this.getState();
            },
            mutate(instruction) {
              window.parent.postMessage({
                type: 'asterism:mutate-node',
                nodeId: this.nodeId,
                instruction: instruction
              }, '*');
            },
            updatePanel(targetNodeId, instruction) {
              window.parent.postMessage({
                type: 'asterism:mutate-node',
                nodeId: targetNodeId || this.nodeId,
                instruction: instruction
              }, '*');
            },
            spawnRelatedPanel(options) {
              const opts = typeof options === 'string' ? { prompt: options } : (options || {});
              window.parent.postMessage({
                type: 'asterism:spawn-related',
                sourceNodeId: this.nodeId,
                relation: opts.relation || 'visualizes-ui',
                surfaceRole: opts.surfaceRole,
                title: opts.title,
                prompt: opts.prompt
              }, '*');
            },
            spawnFork(prompt, options) {
              window.parent.postMessage(Object.assign({
                type: 'asterism:trigger-speculate',
                nodeId: this.nodeId,
                prompt: prompt
              }, options || {}), '*');
            },
            keepFork(pruneSiblings) {
              window.parent.postMessage({
                type: 'asterism:commit-branch',
                nodeId: this.nodeId,
                pruneSiblings: Boolean(pruneSiblings)
              }, '*');
            },
            advanceStage(instruction, targetStage) {
              window.parent.postMessage({
                type: 'asterism:advance-stage',
                nodeId: this.nodeId,
                instruction: instruction,
                targetStage: targetStage
              }, '*');
            },
            synthesizeWith(otherNodeIds, instruction, targetStage) {
              const ids = [this.nodeId].concat(Array.isArray(otherNodeIds) ? otherNodeIds : [otherNodeIds]);
              window.parent.postMessage({
                type: 'asterism:synthesize-nodes',
                parentIds: ids,
                instruction: instruction,
                targetStage: targetStage
              }, '*');
            },
            runImplementAgent(instruction) {
              window.parent.postMessage({
                type: 'asterism:run-implement',
                nodeId: this.nodeId,
                instruction: instruction
              }, '*');
            },
            bindInputs(root) {
              const container = root || document;
              const els = container.querySelectorAll('input[data-state-key], select[data-state-key], textarea[data-state-key], input[name], select[name], textarea[name]');
              els.forEach((el) => {
                const key = el.getAttribute('data-state-key') || el.getAttribute('name');
                if (!key || el._asterismBound) return;
                el._asterismBound = true;
                if (Object.prototype.hasOwnProperty.call(_state, key)) {
                  if (el.type === 'checkbox') {
                    el.checked = Boolean(_state[key]);
                  } else if (String(el.value) !== String(_state[key])) {
                    el.value = _state[key];
                    try { el.dispatchEvent(new Event('input', { bubbles: true })); } catch {}
                  }
                }
                const sync = () => {
                  let val = el.type === 'checkbox' ? el.checked : el.value;
                  if (el.type === 'range' || el.type === 'number') {
                    const num = Number(val);
                    if (!Number.isNaN(num)) val = num;
                  }
                  window.asterism.setState({ [key]: val });
                };
                el.addEventListener('input', sync);
                el.addEventListener('change', sync);
              });
            }
          };
          window.addEventListener('DOMContentLoaded', () => {
            window.asterism.bindInputs(document);
          });
        })();
      <\/script></head><body>${node.html || ''}</body></html>`;
    }

    function formatDiffPatchHtml(node) {
      const impl = node.implementation;
      const wt = node.worktree;
      if (!wt && !impl) {
        return `<div style="color:#94a3b8;padding:8px;">No isolated Git worktree provisioned yet. Click <strong>▶ Run Agent</strong> above to provision a worktree, generate code &amp; tests, and inspect the live Git diff.</div>`;
      }
      const diff = impl?.diff;
      const patchLines = (diff?.patch || '').split('\n');
      const coloredPatch = patchLines.map((line) => {
        const esc = line.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        if (line.startsWith('+') && !line.startsWith('+++')) {
          return `<div style="background:rgba(16,185,129,0.14);color:#6ee7b7;">${esc}</div>`;
        }
        if (line.startsWith('-') && !line.startsWith('---')) {
          return `<div style="background:rgba(239,68,68,0.14);color:#fca5a5;">${esc}</div>`;
        }
        if (line.startsWith('@@')) {
          return `<div style="color:#38bdf8;margin-top:4px;">${esc}</div>`;
        }
        return `<div style="color:#94a3b8;">${esc}</div>`;
      }).join('');

      const filesHtml = (diff?.changedFiles || []).map(f =>
        `<span style="background:rgba(30,41,59,0.9);border:1px solid rgba(148,163,184,0.25);padding:2px 6px;border-radius:4px;font-size:10px;">${f.status} ${f.path} (<span style="color:#34d399">+${f.insertions}</span>/<span style="color:#f87171">-${f.deletions}</span>)</span>`
      ).join(' ');

      return `
        <div style="margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid rgba(148,163,184,0.2);">
          <div style="display:flex;justify-content:space-between;color:#f8fafc;font-weight:700;margin-bottom:4px;">
            <span>Branch: ${wt?.branchName || diff?.branchName || 'asterism/implement'}</span>
            <span>HEAD: ${wt?.headCommit || diff?.headCommit || wt?.baseCommit || 'HEAD'}</span>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px;">${filesHtml || '<span style="color:#64748b;">Working tree clean (all changes committed)</span>'}</div>
          ${impl?.testOutput ? `<details style="margin-top:4px;"><summary style="cursor:pointer;color:${impl.testPassed ? '#34d399' : '#f87171'};font-weight:600;">${impl.testPassed ? '✓ node --test Passed' : '✕ node --test Failed'} (${impl.lineageCount || 1} panel lineage)</summary><pre style="margin:4px 0 0;padding:6px;background:#020617;border-radius:4px;color:#cbd5e1;white-space:pre-wrap;font-size:10px;">${impl.testOutput.replace(/</g, '&lt;')}</pre></details>` : ''}
        </div>
        <div style="font-size:10px;line-height:1.4;white-space:pre-wrap;">${coloredPatch || '<span style="color:#64748b;">No uncommitted diff lines.</span>'}</div>
      `;
    }

          card.querySelector('.wt-diff-stat').innerHTML = `<span class="ins">+${ins}</span>/<span class="del">-${del}</span>`;

            testBadge.textContent = '✓ Verified';

            testBadge.textContent = '⚠ Check Failed';

        const iframe = card.querySelector('.node-iframe');
        const editor = card.querySelector('.node-code-editor');
        if (card.dataset.lastHtml !== node.html) {
          card.dataset.lastHtml = node.html;
          iframe.srcdoc = buildSrcDoc(node);
          if (document.activeElement !== editor) {
            editor.value = node.html;
          }
        }
      }

      const advanceBtn = card.querySelector('.advance-btn');
      const delBtn = card.querySelector('.del-btn');
      const wtDiffBtn = card.querySelector('.wt-diff-btn');
      const wtRunBtn = card.querySelector('.wt-run-btn');
      const wtCommitBtn = card.querySelector('.wt-commit-btn');

      const promptInput = card.querySelector('.node-prompt-input');

        tearOffBtn.addEventListener('click', (e) => {
          e.stopPropagation();

          const curRole = node?.surfaceRole || defaultRoleForStage(node?.stage);
          const nextFacet = curRole === 'dialogue' ? 'spec-diagram' : curRole === 'spec-diagram' ? 'ui-prototype' : curRole;
          switchOrTearOffFacet(nodeId, nextFacet, true);
        });
      }

      if (energyPill) {
        energyPill.addEventListener('click', (e) => {
          e.stopPropagation();
          pulseBasalFreeEnergy();
        });

      checkBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleNodeSynthSelection(nodeId);
      });

      roleSelect.addEventListener('change', async (e) => {
        e.stopPropagation();
        const surfaceRole = roleSelect.value;
        await switchOrTearOffFacet(nodeId, surfaceRole, false);
      });

      modelSelect.addEventListener('change', async (e) => {
        e.stopPropagation();
        const model = modelSelect.value;
        const node = state.nodes.find(n => n.id === nodeId);
        if (node) node.model = model;
        showToast(`Switched panel model to ${model.replace('openai/', '')}`);
        await fetch('/api/nodes/state', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nodeId, model })
        });
      });

      keepBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        commitBranch(nodeId, false);
      });

      spawnRelSelect.addEventListener('change', async (e) => {
        e.stopPropagation();
        const val = spawnRelSelect.value;
        spawnRelSelect.value = '';
        if (!val) return;
        const [relation, surfaceRole] = val.split(':');
        const customPrompt = promptInput.value.trim();
        promptInput.value = '';
        await triggerSpawnRelated({
          sourceNodeId: nodeId,
          relation,
          surfaceRole,
          prompt: customPrompt || undefined
        });
      });

      header.addEventListener('pointerdown', (e) => {
        if (e.target.closest('button') || e.target.closest('select')) return;
        e.stopPropagation();

        if (e.shiftKey) {
          toggleNodeSynthSelection(nodeId);
          return;
        }

        if (mode === 'connect') {
          if (!connectSourceId) {
            connectSourceId = nodeId;
            showToast(`Source panel selected (${nodeId}). Now click a target panel header.`);
          } else if (connectSourceId !== nodeId) {
            const targetNode = state.nodes.find(n => n.id === nodeId);
            const tRole = targetNode?.surfaceRole || defaultRoleForStage(targetNode?.stage);
            const rel = tRole === 'ui-prototype' ? 'visualizes-ui' : tRole === 'spec-diagram' ? 'specifies' : tRole === 'artifact-harness' ? 'implements' : 'annotates';
            state.edges.push({
              id: 'edge-' + Date.now(),
              from: connectSourceId,
              to: nodeId,
              relation: rel,
              kind: rel,
              label: rel
            });
            connectSourceId = null;
            setMode('select');
            renderEdges();
            persistState();
          }
          return;
        }

        const node = state.nodes.find(n => n.id === nodeId);
        if (!node) return;
        const startX = e.clientX;
        const startY = e.clientY;
        const origX = node.x;
        const origY = node.y;

        function onMove(ev) {
          node.x = Math.round(origX + (ev.clientX - startX) / state.viewport.scale);
          node.y = Math.round(origY + (ev.clientY - startY) / state.viewport.scale);
          card.style.left = `${node.x}px`;
          card.style.top = `${node.y}px`;
          renderEdges();
        }
        function onUp() {
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
          persistState();
        }
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
      });

      resizeHandle.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        const node = state.nodes.find(n => n.id === nodeId);
        if (!node) return;
        const startX = e.clientX;
        const startY = e.clientY;
        const origW = node.width;
        const origH = node.height;

        function onMove(ev) {
          node.width = Math.max(300, Math.round(origW + (ev.clientX - startX) / state.viewport.scale));
          node.height = Math.max(210, Math.round(origH + (ev.clientY - startY) / state.viewport.scale));
          card.style.width = `${node.width}px`;
          card.style.height = `${node.height}px`;
          renderEdges();
        }
        function onUp() {
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
          persistState();
        }
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
      });

      codeBtn.addEventListener('click', () => {
        card.classList.remove('viewing-diff');
        const isEditing = card.classList.toggle('editing-html');
        if (!isEditing) {
          const node = state.nodes.find(n => n.id === nodeId);
          if (node && editor.value !== node.html) {
            node.html = editor.value;
            renderNodes();
            persistState();
          }
        }
      });

      wtDiffBtn.addEventListener('click', async () => {
        card.classList.remove('editing-html');
        const isViewing = card.classList.toggle('viewing-diff');
        if (isViewing) {
          const res = await fetch(`/api/nodes/implement/diff?nodeId=${encodeURIComponent(nodeId)}`);
          const data = await res.json();
          const node = state.nodes.find(n => n.id === nodeId);
          if (node && data.diff) {
            node.implementation = node.implementation || {};
            node.implementation.diff = data.diff;
            renderNodes();
          }
        }
      });

      wtRunBtn.addEventListener('click', async () => {
        const customPrompt = promptInput.value.trim();
        promptInput.value = '';
        await runImplementAgent(nodeId, customPrompt);
      });

      wtCommitBtn.addEventListener('click', async () => {
        const customMsg = promptInput.value.trim();
        promptInput.value = '';
        showToast('Committing implementation inside isolated Git worktree...', 10000);
        const res = await fetch('/api/nodes/implement/commit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nodeId, message: customMsg || undefined })
        });
        const data = await res.json();
        if (data.commit) {
          showToast(`✓ Committed ${data.commit.commitSha} on branch ${data.commit.branchName}!`);
        }
      });

      specBtn.addEventListener('click', () => {
        const customPrompt = promptInput.value.trim();
        promptInput.value = '';
        triggerSpeculate(
          nodeId,
          customPrompt || 'Explore 3 divergent variants across Arena models',
          { arenaMode: true }
        );
      });

      advanceBtn.addEventListener('click', () => {
        const customPrompt = promptInput.value.trim();
        promptInput.value = '';
        advanceStage(nodeId, customPrompt);
      });

      delBtn.addEventListener('click', () => {
        selectedForSynth.delete(nodeId);
        updateSynthButtonLabel();
        state.nodes = state.nodes.filter(n => n.id !== nodeId);
        state.edges = state.edges.filter(e => e.from !== nodeId && e.to !== nodeId);
        renderAll();
        persistState();
      });

      async function runMutate() {
        const instruction = promptInput.value.trim();
        if (!instruction) return;
        promptInput.value = '';
        await mutateNode(nodeId, instruction);
      }

      sendBtn.addEventListener('click', runMutate);
      promptInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') runMutate();
      });
    }

    let comparedNodeIds = [];

    async function switchOrTearOffFacet(nodeId, facetRole, tearOff = false) {
      showToast(
        tearOff
          ? `⧉ Tearing off "${facetRole}" facet lens into a linked side-by-side panel...`
          : `Switching Crystallization Facet to "${facetRole}"...`,
        14000
      );
      const res = await fetch('/api/nodes/facet', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nodeId, facetRole, tearOff })
      });
      const data = await res.json();
      if (data.tornOffLens) {
        showToast(`⧉ Torn off "${data.tornOffLens.title}" as a linked side-by-side lens!`);
      } else {
        showToast(`Switched facet to "${facetRole}".`);
      }
    }

    async function pulseBasalFreeEnergy() {
      showToast('🔋 Allocating excess Basal Free-Energy Floor across exhausted & high-EVOI frontier nodes...', 8000);
      const res = await fetch('/api/energy/basal-tick', { method: 'POST' });
      const data = await res.json();
      if (data.totalGrantedTokens) {
        const top = data.attentionQueue?.[0];
        showToast(
          `🔋 Basal Free-Energy Floor distributed +${data.totalGrantedTokens} tokens across ${data.allocations?.length || 0} nodes! Top EVOI: "${top?.title || 'root'}" (EVOI=${top?.evoiScore ?? 0})`
        );
      }
    }

    function openComparisonMatrix() {
      let candidates = [...selectedForSynth]
        .map(id => state.nodes.find(n => n.id === id))
        .filter(Boolean);
      if (candidates.length < 2) {
        const specs = state.nodes.filter(n => n.kind === 'speculative' || n.id.startsWith('node-spec-'));
        candidates = specs.length >= 2 ? specs.slice(0, 3) : state.nodes.slice(0, 3);
      }
      comparedNodeIds = candidates.map(n => n.id);
      const grid = document.getElementById('compare-grid');
      const sub = document.getElementById('compare-subtitle');
      sub.textContent = `Projecting ${candidates.length} sibling thoughts side-by-side (${candidates.map(c => c.title).join(' vs. ')})`;
      grid.innerHTML = '';
      for (const n of candidates) {
        const col = document.createElement('div');
        col.className = 'compare-col';
        const shortModel = (n.model || 'gpt-6-luna').replace('openai/', '');
        const pScore = typeof n.jevScore === 'number' ? `p=${n.jevScore}` : 'calibrated';
        col.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:rgba(30,41,59,0.92);border-bottom:1px solid rgba(148,163,184,0.2);font-size:11px;">
            <div>
              <strong style="color:#f8fafc;">${n.title}</strong>
              <span style="margin-left:6px;color:#38bdf8;font-family:ui-monospace,monospace;font-size:10px;">${shortModel} • ${pScore}</span>
            </div>
            <button class="mini-btn" onclick="commitBranch('${n.id}', false); closeComparisonMatrix();">✓ Keep</button>
          </div>
          <iframe style="flex:1;width:100%;border:none;background:transparent;" sandbox="allow-scripts allow-same-origin"></iframe>
        `;
        const iframe = col.querySelector('iframe');
        iframe.srcdoc = buildSrcDoc(n);
        grid.appendChild(col);
      }
      document.getElementById('compare-modal').classList.add('open');
    }

    function closeComparisonMatrix() {
      document.getElementById('compare-modal').classList.remove('open');
    }

    async function synthesizeFromComparisonMatrix() {
      const ids = [...comparedNodeIds];
      closeComparisonMatrix();
      if (ids.length >= 2) {
        await synthesizeSelectedOrKept(ids);
      }
    }

    async function mutateNode(nodeId, instruction) {
      showToast(`Collaborating with agent on "${nodeId}" (regret-minimizing)...`, 18000);
      const res = await fetch('/api/nodes/mutate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nodeId, instruction })
      });
      const data = await res.json();
      if (data.branchedNewFuture && data.branchedRevisionNode) {
        showToast(`🌱 Regret-Free Branch: Created "${data.branchedRevisionNode.title}" while preserving the existing downstream timeline intact!`);
      } else if (data.spawnedPanels && data.spawnedPanels.length > 0) {
        showToast(`Agent updated panel AND spawned ${data.spawnedPanels.length} companion panel(s): ${data.spawnedPanels.map(p => p.title).join(', ')}!`);
      } else {
        showToast('Panel updated!');
      }
    }

    async function triggerSpawnRelated({ sourceNodeId, relation = 'visualizes-ui', surfaceRole, title, prompt }) {
      showToast(`Spawning companion "${surfaceRole || relation}" panel linked via "${relation}"...`, 18000);
      const res = await fetch('/api/nodes/spawn-related', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sourceNodeId, relation, surfaceRole, title, prompt })
      });
      const data = await res.json();
      if (data.childNode) {
        showToast(`✦ Spawned companion panel "${data.childNode.title}" (${data.childNode.surfaceRole})!`);
      }
    }

    async function triggerSpeculate(nodeId, prompt, options = {}) {
      showToast('⚔ Arena Forking: Pitting gpt-6-luna, gpt-6.1-terra, and gpt-6.1-sol in parallel...', 20000);
      await fetch('/api/nodes/speculate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          nodeId,
          prompt,
          count: options.count || 3,
          arenaMode: options.arenaMode ?? true,
          surfaceRole: options.surfaceRole,
          models: options.models
        })
      });
      showToast('3 Arena branches ready! Use "✓ Keep" in the card header or "⊕ Synthesize Panels" to merge them.');
    }

    async function synthesizeSelectedOrKept(customParentIds, instruction, targetStage) {
      let parentIds = Array.isArray(customParentIds) ? customParentIds : [...selectedForSynth];
      if (parentIds.length < 2) {
        const committedForks = state.nodes.filter(n => n.status === 'committed' && n.parentId);
        if (committedForks.length >= 2) {
          parentIds = committedForks.slice(-2).map(n => n.id);
        } else {
          const specForks = state.nodes.filter(n => n.kind === 'speculative' || n.branchTag?.startsWith('fork-'));
          parentIds = specForks.slice(0, 2).map(n => n.id);
        }
      }

      if (parentIds.length < 2) {
        showToast('Select at least 2 panels using their ☐ header checkboxes to synthesize!');
        return;
      }

      showToast(`⊕ Synthesizing ${parentIds.length} parent panels into a unified hybrid surface...`, 20000);
      const res = await fetch('/api/nodes/synthesize', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ parentIds, instruction, targetStage })
      });
      const data = await res.json();
      selectedForSynth.clear();
      updateSynthButtonLabel();
      if (data.synthNode) {
        showToast(`⊕ Created "${data.synthNode.title}" (${data.synthNode.surfaceRole}) from ${parentIds.length} parents!`);
      }
    }

    async function runImplementAgent(nodeId, instruction) {
      showToast('⚙ Running Outbox Agent inside isolated Git worktree (generating module + running node --test)...', 15000);
      const res = await fetch('/api/nodes/implement/run', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nodeId, instruction })
      });
      const data = await res.json();
      if (data.implementation) {
        const ins = data.implementation.diff?.insertions ?? 0;
        const passed = data.implementation.testPassed;
        showToast(`⚙ Worktree implementation ${passed ? 'verified ✓' : 'completed'} (+${ins} lines). Click "🔍 Diff" on the card to inspect!`);
      }
    }

    async function commitBranch(nodeId, pruneSiblings = false) {
      showToast('✓ Marked fork as Kept! (Select 2+ panels and click "⊕ Synthesize Panels" to merge them.)');
      await fetch('/api/nodes/commit-branch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nodeId, pruneSiblings })
      });
    }

    async function pruneUnkeptForks(parentId) {
      const res = await fetch('/api/nodes/prune-unkept', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ parentId })
      });
      const data = await res.json();
      showToast(`Pruned ${data.discarded?.length || 0} unkept speculative fork(s). Kept forks remain intact.`);
    }

    async function advanceStage(nodeId, instruction, targetStage) {
      showToast('🚂 Advancing branch to next Innovation Train stage...', 20000);
      await fetch('/api/nodes/advance', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nodeId, instruction, targetStage })
      });
      showToast('Next stage spawned on the Innovation Train!');
    }

    // Listen to messages from surface iframes (`window.asterism.*`)
    window.addEventListener('message', async (e) => {
      if (!e.data || typeof e.data !== 'object') return;
      const msg = e.data;
      if (msg.type === 'asterism:set-state' && msg.nodeId && msg.patch) {
        const node = state.nodes.find(n => n.id === msg.nodeId);
        if (node) {
          node.state = Object.assign({}, node.state || {}, msg.patch);
          const card = nodesLayer.querySelector(`[data-id="${node.id}"]`);
          if (card) {
            const keys = Object.keys(node.state);
            const pill = card.querySelector('.state-pill');
            if (pill) {
              pill.textContent = `⚡ ${keys.length}`;
              pill.title = `window.asterism.state: ${JSON.stringify(node.state)}`;
            }
          }
        }
        await fetch('/api/nodes/state', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nodeId: msg.nodeId, patch: msg.patch })
        });
      } else if (msg.type === 'asterism:mutate-node') {
        mutateNode(msg.nodeId, msg.instruction);
      } else if (msg.type === 'asterism:spawn-related') {
        triggerSpawnRelated(msg);
      } else if (msg.type === 'asterism:trigger-speculate') {
        triggerSpeculate(msg.nodeId, msg.prompt, msg);
      } else if (msg.type === 'asterism:commit-branch') {
        commitBranch(msg.nodeId, Boolean(msg.pruneSiblings));
      } else if (msg.type === 'asterism:prune-unkept') {
        pruneUnkeptForks(msg.parentId);
      } else if (msg.type === 'asterism:advance-stage') {
        advanceStage(msg.nodeId, msg.instruction, msg.targetStage);
      } else if (msg.type === 'asterism:synthesize-nodes') {
        synthesizeSelectedOrKept(msg.parentIds, msg.instruction, msg.targetStage);
      } else if (msg.type === 'asterism:run-implement') {
        runImplementAgent(msg.nodeId, msg.instruction);
      }
    });

    // Canvas panning & freehand sketching
    viewportEl.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.canvas-node') || e.target.closest('.hud-topbar')) return;

      if (mode === 'draw') {
        const pt = screenToWorld(e.clientX, e.clientY);
        activeStroke = { id: 'stroke-' + Date.now(), color: '#38bdf8', points: [pt] };
        state.strokes.push(activeStroke);
        renderStrokes();
        return;
      }

      isPanning = true;
      viewportEl.classList.add('panning');
      panStart = { x: e.clientX - state.viewport.x, y: e.clientY - state.viewport.y };
    });

    window.addEventListener('pointermove', (e) => {
      if (activeStroke) {
        activeStroke.points.push(screenToWorld(e.clientX, e.clientY));
        renderStrokes();
        return;
      }
      if (!isPanning) return;
      state.viewport.x = e.clientX - panStart.x;
      state.viewport.y = e.clientY - panStart.y;
      applyTransform();
    });

    window.addEventListener('pointerup', () => {
      if (activeStroke) {
        activeStroke = null;
        persistState();
      }
      if (isPanning) {
        isPanning = false;
        viewportEl.classList.remove('panning');
      }
    });

    viewportEl.addEventListener('wheel', (e) => {
      if (e.target.closest('.node-body')) return;
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
      const nextScale = Math.min(2.0, Math.max(0.3, state.viewport.scale * zoomFactor));
      const wx = (e.clientX - state.viewport.x) / state.viewport.scale;
      const wy = (e.clientY - state.viewport.y) / state.viewport.scale;
      state.viewport.scale = nextScale;
      state.viewport.x = e.clientX - wx * nextScale;
      state.viewport.y = e.clientY - wy * nextScale;
      applyTransform();
    }, { passive: false });

    function createNewSurface() {
      const center = screenToWorld(window.innerWidth / 2, window.innerHeight / 2);
      const id = 'node-proposal-' + Date.now();
      state.nodes.push({
        id,
        title: 'Feature Proposal / Dialogue',
        kind: 'surface',
        stage: 'note',
        surfaceRole: 'dialogue',
        x: Math.round(center.x - 195),
        y: Math.round(center.y - 145),
        width: 395,
        height: 295,
        model: 'openai/gpt-6-luna',
        status: 'ready',
        branchTag: 'dialogue',
        state: { priority: 80, scope: 'mvp' },
        html: `<div style="font-family:system-ui,sans-serif;padding:15px;color:#e2e8f0;font-size:12px;">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
    <span style="background:rgba(56,189,248,0.16);color:#38bdf8;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;">💬 DIALOGUE / PROPOSAL</span>
    <span style="color:#94a3b8;font-size:10.5px;">Agent ↔ Dev Medium</span>
  </div>
  <h4 style="margin:0 0 6px;color:#f8fafc;font-size:13.5px;">New Feature Proposal</h4>
  <p style="font-size:11.5px;color:#94a3b8;margin:0 0 10px;">Use this panel to align on decisions and trade-offs with the agent—or spawn a linked <strong>🎨 UI Prototype</strong> or <strong>📐 Spec Contract</strong> companion panel.</p>
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:11px;color:#cbd5e1;">
    <span>Priority:</span>
    <input type="range" min="1" max="100" value="80" data-state-key="priority" style="flex:1;accent-color:#38bdf8;" />
  </div>
  <div style="display:flex;gap:6px;">
    <button onclick="window.asterism.spawnRelatedPanel({relation:'visualizes-ui', surfaceRole:'ui-prototype', prompt:'Build an interactive UI prototype for this proposal'})" style="flex:1;background:rgba(244,114,182,0.18);color:#f9a8d4;border:1px solid rgba(244,114,182,0.4);padding:6px 8px;border-radius:6px;font-size:10.5px;font-weight:600;cursor:pointer;">🎨 + UI Prototype</button>
    <button onclick="window.asterism.spawnRelatedPanel({relation:'specifies', surfaceRole:'spec-diagram', prompt:'Create an architecture & contract spec for this proposal'})" style="flex:1;background:rgba(192,132,252,0.18);color:#d8b4fe;border:1px solid rgba(192,132,252,0.4);padding:6px 8px;border-radius:6px;font-size:10.5px;font-weight:600;cursor:pointer;">📐 + Spec Panel</button>
  </div>
</div>`
      });
      renderAll();
      persistState();
    }

    function clearSketches() {
      state.strokes = [];
      renderStrokes();
      persistState();
    }

    async function resetCanvas() {
      selectedForSynth.clear();
      updateSynthButtonLabel();
      await fetch('/api/reset', { method: 'POST' });
      showToast('Canvas reset to default Multi-Role Innovation Train state.');
    }

    async function persistState() {
      await fetch('/api/state', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(state)
      });
    }

    function renderAll() {
      applyTransform();
      renderNodes();
      renderEdges();
      renderStrokes();
    }

    const evtSource = new EventSource('/api/events');
    evtSource.addEventListener('state', (e) => {
      const incoming = JSON.parse(e.data);
      const keepViewport = isPanning;
      const prevVp = state.viewport;
      state = incoming;
      if (keepViewport) state.viewport = prevVp;
      renderAll();
    });
  </script>
</body>
</html>
